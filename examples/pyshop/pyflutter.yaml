name: pyshop
description: "PyShop — Modern E-Commerce Application showcasing Material 3 and PyQt-style OOP in PyFlutter"
version: 1.0.0

# PyFlutter project configuration
pyflutter:
  entrypoint: main.py
  port: 7879

# Native Flutter packages (identical to pubspec.yaml dependencies)
dependencies:
  flutter:
    url_launcher: ^6.3.0

# Device permissions automatically mapped to Android / iOS
permissions:
  - internet
  - phone
  - email
