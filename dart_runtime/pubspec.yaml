name: pyflutter_dart_runtime
description: >
  Minimal Flutter shell for the PyFlutter POC. Connects to the Rust
  bridge's relay mode over a local TCP socket, renders whatever
  RenderTree it receives, and sends CallbackEvent back on taps.
  See ../README.md and ../PYFLUTTER_VISION.md for context.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  # dart:ffi helpers (malloc, Utf8) used by lib/bridge/ffi_bridge.dart.
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  # The core runtime has no external package on purpose: the Protobuf wire
  # format is hand-encoded in lib/ir_codec.dart, and every optional Flutter
  # package (url_launcher, camera, ...) is added per project by
  # `pyflutter add <package>` (see plugin_catalog/).

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
