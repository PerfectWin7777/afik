# Metadata read by `pyflutter add local_auth` (see AUDIT_BUGS.md, ticket T-20).
name: local_auth
package: local_auth
constraint: ^2.3.0
shim: shim.dart
shim_class: LocalAuthShim
registers: [local_auth]
python_module: pyflutter.plugins.local_auth
android:
  permissions: [biometrics]          # keys of PERMISSION_MAP_ANDROID in cli/manifest_sync.py
  main_activity_base: FlutterFragmentActivity
  launch_theme_parent: "@style/Theme.AppCompat.DayNight.NoActionBar"
ios:
  permissions: [face_id]
