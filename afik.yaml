name: pyshop
description: "Afik Mobile E-Commerce Application powered by Flutter, Python 3, and Rust"
version: 1.0.0

# Afik project configuration
afik:
  entrypoint: examples/pyshop/main.py
  port: 7879

# Plugins from the catalog (dart_runtime/plugin_catalog), installed on demand.
# `afik add <name>` edits this list; `afik run` and `build` apply it.
plugins:
  - url_launcher

# Device permissions automatically mapped to Android / iOS
permissions:
  - internet
  - phone
  - email
