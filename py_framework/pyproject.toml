[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyflutter"
version = "0.1.0"
description = "High-performance Python to Flutter bridge with static UI compilation and embedded runtime"
requires-python = ">=3.10"
dependencies = [
    "protobuf>=4.21.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
pydantic = ["pydantic>=2.0.0"]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
pyflutter = "pyflutter.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyflutter*"]

[tool.setuptools.package-data]
pyflutter = ["contract/*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["pyflutter/generated"]

[tool.ruff.lint]
select = ["E", "F", "I"]
# Long lines are tolerated (docstrings, prop tables); everything else must be clean.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests may bind lambdas to names for brevity.
"tests/*" = ["E731"]

[tool.ruff.lint.isort]
known-first-party = ["pyflutter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
