name: pyshop
description: "PyFlutter Mobile E-Commerce Application powered by Flutter, Python 3, and Rust"
version: 1.0.0

# PyFlutter project configuration
pyflutter:
  entrypoint: examples/pyshop/main.py
  port: 7879

# Plugins from the catalog (dart_runtime/plugin_catalog), installed on demand.
# `pyflutter add <name>` edits this list; `pyflutter run` and `build` apply it.
plugins:
  - url_launcher

# Device permissions automatically mapped to Android / iOS
permissions:
  - internet
  - phone
  - email
